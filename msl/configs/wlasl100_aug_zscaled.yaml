# WLASL100 backbone pretraining -- AMERICAN SIGN LANGUAGE, not MSL.
#
# Every number produced from this config is an ASL number, on a corpus that is
# 55.3% complete (1127 of 2038 clips; 911 lost to dead hosts and private
# videos). It exists to pretrain a backbone, never to supply MSL vocabulary.
#
# SCALED-z: z kept, but rescaled onto x and y's scale. Tests the refined S4.3
# claim that z is harmful for being LOUD rather than for being meaningless. If
# the harm was loudness alone, a rescaled z should recover whatever depth cue
# exists; if it still does not help, that is evidence about z's information
# content rather than its magnitude.
#
# z_scale = std(x,y) / std(z) = 0.6953, FITTED ON THE TRAINING SPLIT ONLY over
# 8.4M x/y values and 4.2M z values from frames that normalised. It is a fitted
# parameter, so fitting it on val or test would leak. For reference and not used
# to fit: the same ratio is 0.7008 on val and 0.7138 on test, so the constant is
# stable across splits.
#
# Everything else is IDENTICAL to wlasl100_aug.yaml.

feature:
  use_z: true         # kept on purpose here -- this run is about scaling it
  z_scale: 0.6953     # std(x,y)/std(z), fitted on train only
  seq_len: 64

model:
  arch: transformer    # spec S6 baseline. TCN is the one to beat -- see README.
  d_model: 128
  n_layers: 4
  n_heads: 4
  ffn_dim: 256
  dropout: 0.3         # small-data regime: regularise hard
  tcn_kernel_size: 5

train:
  batch_size: 32       # 666 training clips -> ~21 steps per epoch
  lr: 0.001
  weight_decay: 0.01
  max_steps: 4000      # ~192 epochs; early stopping is expected to fire first
  warmup_steps: 200
  label_smoothing: 0.1
  grad_clip: 1.0
  eval_every: 50       # ~2.4 epochs
  patience: 12         # 600 steps without a val top-1 improvement
  seed: 1234
  num_workers: 0
  out_dir: checkpoints/wlasl100_zscaled
  log_dir: runs/wlasl100_zscaled
  tensorboard: true

synthetic:
  n_train: 128
  n_val: 32
  num_classes: 100     # unused on this path; kept consistent with the vocabulary
  seed: 0

augment:
  enabled: true
  speed_min: 0.8         # realised as a random temporal crop -- see augment.py
  speed_max: 1.2
  frame_dropout: 0.05
  rotation_degrees: 10.0 # about the camera axis
  scale_min: 0.9
  scale_max: 1.1
  joint_noise_std: 0.01  # inter-shoulder units (shoulders sit at +/-0.5)
  mirror: false          # OFF: mirroring changes signer handedness (spec S5)
