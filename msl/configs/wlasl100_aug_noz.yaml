# WLASL100 backbone pretraining -- AMERICAN SIGN LANGUAGE, not MSL.
#
# Every number produced from this config is an ASL number, on a corpus that is
# 55.3% complete (1127 of 2038 clips; 911 lost to dead hosts and private
# videos). It exists to pretrain a backbone, never to supply MSL vocabulary.
#
# The z ablation (spec S4.3): the augmented reference with MediaPipe's z channel
# removed. EVERYTHING ELSE IS IDENTICAL to wlasl100_aug.yaml, so the delta is
# attributable to z alone. Per-frame features drop from 275 to 184.
#
# No re-extraction is needed and none is done. The cache holds use_z=true
# tensors, and the dataset slices z out at load time via landmarks.drop_z. That
# is EXACT rather than approximate: normalise_frame derives the origin and the
# inter-shoulder scale from x and y only, so x and y never depend on z.
# tests/test_landmarks.py asserts the slice equals normalise_frame(use_z=False)
# directly, under a 16:9 frame so aspect correction is exercised too.

feature:
  use_z: false        # ABLATION: drop the unreliable MediaPipe z channel
  seq_len: 64

model:
  arch: transformer    # spec S6 baseline. TCN is the one to beat -- see README.
  d_model: 128
  n_layers: 4
  n_heads: 4
  ffn_dim: 256
  dropout: 0.3         # small-data regime: regularise hard
  tcn_kernel_size: 5

train:
  batch_size: 32       # 666 training clips -> ~21 steps per epoch
  lr: 0.001
  weight_decay: 0.01
  max_steps: 4000      # ~192 epochs; early stopping is expected to fire first
  warmup_steps: 200
  label_smoothing: 0.1
  grad_clip: 1.0
  eval_every: 50       # ~2.4 epochs
  patience: 12         # 600 steps without a val top-1 improvement
  seed: 1234
  num_workers: 0
  out_dir: checkpoints/wlasl100_aug_noz
  log_dir: runs/wlasl100_aug_noz
  tensorboard: true

synthetic:
  n_train: 128
  n_val: 32
  num_classes: 100     # unused on this path; kept consistent with the vocabulary
  seed: 0

augment:
  enabled: true
  speed_min: 0.8         # realised as a random temporal crop -- see augment.py
  speed_max: 1.2
  frame_dropout: 0.05
  rotation_degrees: 10.0 # about the camera axis
  scale_min: 0.9
  scale_max: 1.1
  joint_noise_std: 0.01  # inter-shoulder units (shoulders sit at +/-0.5)
  mirror: false          # OFF: mirroring changes signer handedness (spec S5)
