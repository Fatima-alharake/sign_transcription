[project]
name = "msl"
version = "0.1.0"
description = "Mongolian Sign Language recognition and translation"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "torch>=2.13",
    "pyyaml>=6.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "tensorboard>=2.16",
    "psutil>=5.9",
    "mediapipe>=1.0.0",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# PyTorch CUDA build. The default PyPI wheel is CPU-only; this machine has an
# RTX 3060 (driver 610.47, CUDA 13.3), so we pull from PyTorch's CUDA 13.0
# index. CUDA minor-version compatibility means a cu130 build runs on any 13.x
# driver. `explicit = true` keeps every other dependency on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
